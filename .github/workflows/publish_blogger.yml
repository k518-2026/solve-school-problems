name: Solve School Problems - Daily 06:35 JST Blogger Publisher

on:
  schedule:
    # 毎日 朝 06:35 JST (21:35 UTC 前日) に GitHub に蓄積されている記事を 1日1本 Blogger へ自動投稿（規約・スパム防止準拠）
    - cron: '35 21 * * *'

  # Manual execution from GitHub Actions UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (Simulate without sending actual email)'
        required: true
        type: boolean
        default: false
      topic_id:
        description: 'Specific topic ID from catalog (e.g. A10, B10, C09, or leave blank for next accumulated story)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: solve-school-problems-blogger
  cancel-in-progress: false

jobs:
  publish_blogger:
    name: Publish Daily Story to Blogger (06:35 JST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (No external AI APIs)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover tests

      - name: Publish Accumulated GitHub Article to Blogger (06:35 JST)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PAUSE_BLOG_AUTO_POST: 'false'
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || 'true' }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || 'false' }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || 'Solve School Problems' }}
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
        run: |
          git pull --rebase origin main || true
          ARGS="--blogger-only"
          if [ -n "${{ github.event.inputs.topic_id }}" ]; then
            ARGS="$ARGS --topic-id ${{ github.event.inputs.topic_id }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          else
            ARGS="$ARGS --send"
          fi
          python -m src.main $ARGS

      - name: Commit and Push Updated History & GitHub Pages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add README.md docs/ content/ data/history.json data/POSTED_STORIES.md

          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "chore(blogger): Publish daily article to Blogger (06:35 JST) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:${{ github.ref }}
          fi
