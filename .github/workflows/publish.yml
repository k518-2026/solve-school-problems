name: Solve School Problems - Daily 05:00 JST Blogger Publisher & GitHub Pages

on:
  schedule:
    # 毎日 朝 05:00 JST (20:00 UTC) に GitHub に蓄積されている記事を 1日1本 Blogger へ自動投稿（Blogger利用規約準拠）
    - cron: '0 20 * * *'

  # Manual execution from GitHub Actions UI
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Story Pattern (auto: alternates A/B/C, A: Pedagogy, B: School ICT DX, C: School Law)'
        required: true
        type: choice
        options:
          - auto
          - A
          - B
          - C
        default: 'auto'
      dry_run:
        description: 'Dry run mode (Simulate without sending actual email)'
        required: true
        type: boolean
        default: false
      post_status:
        description: 'Post status (publish or draft)'
        required: true
        type: choice
        options:
          - publish
          - draft
        default: 'publish'
      topic_id:
        description: 'Specific topic ID from catalog (e.g. A10, B10, C09, or leave blank for next accumulated story)'
        required: false
        type: string
        default: ''
      blogger_only:
        description: 'Send to Blogger only'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: solve-school-problems-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish 1 Accumulated Story to Blogger (05:00 JST) & Update GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (No external AI APIs)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover tests

      - name: Publish 1 Accumulated GitHub Article to Blogger (Blogger ToS Compliant)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PAUSE_BLOG_AUTO_POST: 'false'
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || 'true' }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || 'false' }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || 'Solve School Problems' }}
          ENABLE_WP_POST: 'false'
          WP_POST_EMAIL: ''
          BLOGGER_POST_EMAIL: ${{ secrets.BLOGGER_POST_EMAIL }}
          DEFAULT_POST_STATUS: ${{ github.event.inputs.post_status || 'publish' }}
          USE_JETPACK_SHORTCODES: 'true'
        run: |
          git pull --rebase origin main || true
          ARGS="--blogger-daily"
          if [ -n "${{ github.event.inputs.topic_id }}" ]; then
            ARGS="$ARGS --topic-id ${{ github.event.inputs.topic_id }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          else
            ARGS="$ARGS --send"
          fi
          python -m src.main $ARGS

      - name: Commit and Push Updated History & GitHub Pages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add README.md docs/ content/ data/history.json data/POSTED_STORIES.md

          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "chore(blogger): Record daily 05:00 JST Blogger publication & update GitHub Pages [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:${{ github.ref }}
          fi
