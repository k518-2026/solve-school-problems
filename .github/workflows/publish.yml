name: Solve School Problems - GitHub Pages & Blog Publisher

on:
  # schedule:  # 2026-10-06 ブログメール自動投稿お休み＆GitHub Pages蓄積モードのため一時停止。再開は # を外す
    # - cron: '15 21 * * *'
    # - cron: '15 8 * * *'
    # - cron: '15 13 * * *'

  # Manual execution from GitHub Actions UI
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Story Pattern (auto: alternates A/B/C, A: Pedagogy, B: School ICT DX, C: School Law)'
        required: true
        type: choice
        options:
          - auto
          - A
          - B
          - C
        default: 'auto'
      dry_run:
        description: 'Dry run mode (Simulate without sending actual email)'
        required: true
        type: boolean
        default: false
      post_status:
        description: 'Post status on WordPress (publish or draft)'
        required: true
        type: choice
        options:
          - publish
          - draft
        default: 'publish'
      topic_id:
        description: 'Specific topic ID from catalog (e.g. A01, B02, C01, or leave blank for auto-selection)'
        required: false
        type: string
        default: ''
      blogger_only:
        description: 'Blogger test/repost only (send latest published story to Blogger without sending to WordPress)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: solve-school-problems-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build GitHub Pages Library (Blog Auto-Post Paused)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (No external AI APIs)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover tests

      - name: Update GitHub Pages Library (Blog Auto-Post Paused)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PAUSE_BLOG_AUTO_POST: 'true'
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || 'true' }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || 'false' }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || 'Solve School Problems' }}
          ENABLE_WP_POST: 'false'
          WP_POST_EMAIL: ''
          BLOGGER_POST_EMAIL: ''
          DEFAULT_POST_STATUS: ${{ github.event.inputs.post_status || 'publish' }}
          USE_JETPACK_SHORTCODES: 'true'
        run: |
          git pull --rebase origin main || true
          python -m src.main --build-pages

      - name: Commit and Push Updated GitHub Pages & History
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add README.md docs/ content/ data/history.json data/POSTED_STORIES.md

          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "chore: Update Solve School Problems GitHub Pages [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:${{ github.ref }}
          fi
