name: Deploy Solve School Problems Novel Library to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'docs/**'
      - 'data/**'
      - 'src/site_builder.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lightweight dependencies (Markdown & PyYAML only, no external AI APIs)
        run: |
          python -m pip install --upgrade pip
          pip install markdown pyyaml

      - name: Build GitHub Pages Static Site (docs/)
        run: |
          python -m src.site_builder

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
